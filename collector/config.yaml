          - set(attributes["cost_usd_estimated"], ((Double(attributes["input_token_count"]) - Double(attributes["cached_content_token_count"])) * ${file:/pricing/GEMINI_FLASH_IN} + Double(attributes["cached_content_token_count"]) * ${file:/pricing/GEMINI_FLASH_CACHED} + Double(attributes["output_token_count"]) * ${file:/pricing/GEMINI_FLASH_OUT}) / 1000000.0) where attributes["event.name"] == "gemini_cli.api_response" and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and attributes["cached_content_token_count"] != nil and attributes["cost_usd_estimated"] == nil and IsMatch(attributes["model"], "gemini-.*flash")
          - set(attributes["cost_usd_estimated"], (Double(attributes["input_token_count"]) * ${file:/pricing/GEMINI_FLASH_IN} + Double(attributes["output_token_count"]) * ${file:/pricing/GEMINI_FLASH_OUT}) / 1000000.0) where attributes["event.name"] == "gemini_cli.api_response" and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and attributes["cached_content_token_count"] == nil and attributes["cost_usd_estimated"] == nil and IsMatch(attributes["model"], "gemini-.*flash")
          # --- Set effective cost and metadata for all matched models ---
          - set(attributes["effective_cost_usd"], attributes["cost_usd_estimated"]) where attributes["event.name"] == "gemini_cli.api_response" and attributes["cost_usd_estimated"] != nil
          - set(attributes["cost_source"], "estimated") where attributes["event.name"] == "gemini_cli.api_response" and attributes["cost_usd_estimated"] != nil
          - set(attributes["pricing_as_of"], "2026-07-11") where attributes["event.name"] == "gemini_cli.api_response" and attributes["cost_usd_estimated"] != nil
          # --- Unsupported model fallback ---
          - set(attributes["cost_source"], "unsupported") where attributes["event.name"] == "gemini_cli.api_response" and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and attributes["effective_cost_usd"] == nil
          - set(attributes["pricing_as_of"], "2026-07-11") where attributes["event.name"] == "gemini_cli.api_response" and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and attributes["effective_cost_usd"] == nil
  # Normalize dotted OTel attributes once so dashboards can use the stable
  # `event_name`, `service_name`, and `event_kind` field names.
  #
  # MUST run after transform/codex_enrichment and transform/gemini_enrichment:
  # both of those read attributes["event.name"], which this processor removes.
  transform/vl_field_names:
    error_mode: ignore
    log_statements:
      - context: resource
        statements:
          - set(attributes["service_name"], attributes["service.name"]) where attributes["service.name"] != nil
          - delete_key(attributes, "service.name")
      - context: log
        statements:
          - set(attributes["event_name"], attributes["event.name"]) where attributes["event.name"] != nil
          - delete_key(attributes, "event.name")
          - set(attributes["event_kind"], attributes["event.kind"]) where attributes["event.kind"] != nil
          - delete_key(attributes, "event.kind")
  batch:
    timeout: 2s
    send_batch_size: 1024

exporters:
  # The pipeline already produces Prometheus-compatible series, so remote write
  # is the shortest path into VictoriaMetrics.
  prometheusremotewrite:
    endpoint: "http://victoriametrics:8428/api/v1/write"
    resource_to_telemetry_conversion:
      enabled: true
  # Use `logs_endpoint` because VictoriaLogs provides the complete ingestion
  # path. The generic `endpoint` setting would append `/v1/logs` again.
  otlp_http/vlogs:
    logs_endpoint: "http://victorialogs:9428/insert/opentelemetry/v1/logs"
  # Use `traces_endpoint` because the VictoriaTraces ingestion path is already
  # complete. The generic `endpoint` setting would append `/v1/traces` again.
  otlp_http/vtraces:
    traces_endpoint: "http://victoriatraces:10428/insert/opentelemetry/v1/traces"

service:
  extensions: [bearertokenauth, health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors:
        [
          memory_limiter,
          transform/codex_enrichment,
          transform/gemini_enrichment,
          transform/vl_field_names,
          batch,
        ]
      exporters: [otlp_http/vlogs]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/vtraces]
