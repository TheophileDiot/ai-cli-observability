extensions:
  bearertokenauth:
    token: "${OTEL_AUTH_TOKEN}"
  health_check:
    endpoint: "0.0.0.0:13133"

receivers:
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:4318"
        auth:
          authenticator: bearertokenauth

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  transform/codex_enrichment:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(attributes["session_source"], "unknown") where attributes["event.name"] == "codex.conversation_starts" and attributes["session_source"] == nil
          - set(attributes["session_source"], "unknown") where attributes["event.name"] == "codex.conversation_starts" and attributes["session_source"] == ""
          - set(attributes["effective_cost_usd"], attributes["cost_usd"]) where attributes["cost_usd"] != nil
          - set(attributes["cost_source"], "native") where attributes["cost_usd"] != nil
          - set(attributes["pricing_as_of"], "2026-09-08") where attributes["cost_usd"] != nil
          # Standard prices come from pricing-exporter. Tier multipliers follow:
          # https://developers.openai.com/api/docs/models and https://developers.openai.com/api/docs/guides/fast-mode
          - set(attributes["cached_token_count"], 0) where attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["cached_token_count"] == nil
          # GPT-5.4: long context first because Priority excludes requests above 272K input tokens.
          - set(attributes["cost_usd_estimated"], ((Double(attributes["input_token_count"]) - Double(attributes["cached_token_count"])) * ${file:/pricing/GPT54_IN} * 2.0 + Double(attributes["cached_token_count"]) * ${file:/pricing/GPT54_CACHED} * 2.0 + Double(attributes["output_token_count"]) * ${file:/pricing/GPT54_OUT} * 1.5) / 1000000.0) where attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["cost_usd"] == nil and attributes["cost_usd_estimated"] == nil and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and Double(attributes["input_token_count"]) > 272000.0 and IsMatch(attributes["model"], "^gpt-5\\.4($|-[0-9]{4}-[0-9]{2}-[0-9]{2}$)")
          - set(attributes["cost_usd_estimated"], (((Double(attributes["input_token_count"]) - Double(attributes["cached_token_count"])) * ${file:/pricing/GPT54_IN} + Double(attributes["cached_token_count"]) * ${file:/pricing/GPT54_CACHED} + Double(attributes["output_token_count"]) * ${file:/pricing/GPT54_OUT}) * 2.0) / 1000000.0) where attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["cost_usd"] == nil and attributes["cost_usd_estimated"] == nil and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and Double(attributes["input_token_count"]) <= 272000.0 and (attributes["service_tier"] == "priority" or attributes["service_tier"] == "fast") and IsMatch(attributes["model"], "^gpt-5\\.4($|-[0-9]{4}-[0-9]{2}-[0-9]{2}$)")
          - set(attributes["cost_usd_estimated"], ((Double(attributes["input_token_count"]) - Double(attributes["cached_token_count"])) * ${file:/pricing/GPT54_IN} + Double(attributes["cached_token_count"]) * ${file:/pricing/GPT54_CACHED} + Double(attributes["output_token_count"]) * ${file:/pricing/GPT54_OUT}) / 1000000.0) where attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["cost_usd"] == nil and attributes["cost_usd_estimated"] == nil and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and IsMatch(attributes["model"], "^gpt-5\\.4($|-[0-9]{4}-[0-9]{2}-[0-9]{2}$)")
          # GPT-5.4 mini: no long-context surcharge; Priority is available through 272K input tokens.
          - set(attributes["cost_usd_estimated"], (((Double(attributes["input_token_count"]) - Double(attributes["cached_token_count"])) * ${file:/pricing/GPT54_MINI_IN} + Double(attributes["cached_token_count"]) * ${file:/pricing/GPT54_MINI_CACHED} + Double(attributes["output_token_count"]) * ${file:/pricing/GPT54_MINI_OUT}) * 2.0) / 1000000.0) where attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["cost_usd"] == nil and attributes["cost_usd_estimated"] == nil and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and Double(attributes["input_token_count"]) <= 272000.0 and (attributes["service_tier"] == "priority" or attributes["service_tier"] == "fast") and IsMatch(attributes["model"], "^gpt-5\\.4-mini($|-[0-9]{4}-[0-9]{2}-[0-9]{2}$)")
          - set(attributes["cost_usd_estimated"], ((Double(attributes["input_token_count"]) - Double(attributes["cached_token_count"])) * ${file:/pricing/GPT54_MINI_IN} + Double(attributes["cached_token_count"]) * ${file:/pricing/GPT54_MINI_CACHED} + Double(attributes["output_token_count"]) * ${file:/pricing/GPT54_MINI_OUT}) / 1000000.0) where attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["cost_usd"] == nil and attributes["cost_usd_estimated"] == nil and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and IsMatch(attributes["model"], "^gpt-5\\.4-mini($|-[0-9]{4}-[0-9]{2}-[0-9]{2}$)")
          # GPT-5.5: Priority is 2.5x standard; long context is 2x input/cache and 1.5x output.
          - set(attributes["cost_usd_estimated"], ((Double(attributes["input_token_count"]) - Double(attributes["cached_token_count"])) * ${file:/pricing/GPT55_IN} * 2.0 + Double(attributes["cached_token_count"]) * ${file:/pricing/GPT55_CACHED} * 2.0 + Double(attributes["output_token_count"]) * ${file:/pricing/GPT55_OUT} * 1.5) / 1000000.0) where attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["cost_usd"] == nil and attributes["cost_usd_estimated"] == nil and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and Double(attributes["input_token_count"]) > 272000.0 and IsMatch(attributes["model"], "^gpt-5\\.5($|-[0-9]{4}-[0-9]{2}-[0-9]{2}$)")
          - set(attributes["cost_usd_estimated"], (((Double(attributes["input_token_count"]) - Double(attributes["cached_token_count"])) * ${file:/pricing/GPT55_IN} + Double(attributes["cached_token_count"]) * ${file:/pricing/GPT55_CACHED} + Double(attributes["output_token_count"]) * ${file:/pricing/GPT55_OUT}) * 2.5) / 1000000.0) where attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["cost_usd"] == nil and attributes["cost_usd_estimated"] == nil and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and Double(attributes["input_token_count"]) <= 272000.0 and (attributes["service_tier"] == "priority" or attributes["service_tier"] == "fast") and IsMatch(attributes["model"], "^gpt-5\\.5($|-[0-9]{4}-[0-9]{2}-[0-9]{2}$)")
          - set(attributes["cost_usd_estimated"], ((Double(attributes["input_token_count"]) - Double(attributes["cached_token_count"])) * ${file:/pricing/GPT55_IN} + Double(attributes["cached_token_count"]) * ${file:/pricing/GPT55_CACHED} + Double(attributes["output_token_count"]) * ${file:/pricing/GPT55_OUT}) / 1000000.0) where attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["cost_usd"] == nil and attributes["cost_usd_estimated"] == nil and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and IsMatch(attributes["model"], "^gpt-5\\.5($|-[0-9]{4}-[0-9]{2}-[0-9]{2}$)")
          # GPT-5.6 and GPT-6: cache writes cost 1.25x input; Fast also applies to long context.
          # https://developers.openai.com/api/docs/pricing
          # https://developers.openai.com/api/docs/guides/prompt-caching
          - set(cache["input_price"], ${file:/pricing/GPT6_ASTRA_IN}) where IsMatch(attributes["model"], "^gpt-6-astra($|-[0-9]{4}-[0-9]{2}-[0-9]{2}$)")
          - set(cache["cached_price"], ${file:/pricing/GPT6_ASTRA_CACHED}) where IsMatch(attributes["model"], "^gpt-6-astra($|-[0-9]{4}-[0-9]{2}-[0-9]{2}$)")
          - set(cache["output_price"], ${file:/pricing/GPT6_ASTRA_OUT}) where IsMatch(attributes["model"], "^gpt-6-astra($|-[0-9]{4}-[0-9]{2}-[0-9]{2}$)")
          - set(cache["input_price"], ${file:/pricing/GPT56_SOL_IN}) where IsMatch(attributes["model"], "^gpt-5\\.6(-sol)?($|-[0-9]{4}-[0-9]{2}-[0-9]{2}$)")
          - set(cache["cached_price"], ${file:/pricing/GPT56_SOL_CACHED}) where IsMatch(attributes["model"], "^gpt-5\\.6(-sol)?($|-[0-9]{4}-[0-9]{2}-[0-9]{2}$)")
          - set(cache["output_price"], ${file:/pricing/GPT56_SOL_OUT}) where IsMatch(attributes["model"], "^gpt-5\\.6(-sol)?($|-[0-9]{4}-[0-9]{2}-[0-9]{2}$)")
          - set(cache["input_price"], ${file:/pricing/GPT56_TERRA_IN}) where IsMatch(attributes["model"], "^gpt-5\\.6-terra($|-[0-9]{4}-[0-9]{2}-[0-9]{2}$)")
          - set(cache["cached_price"], ${file:/pricing/GPT56_TERRA_CACHED}) where IsMatch(attributes["model"], "^gpt-5\\.6-terra($|-[0-9]{4}-[0-9]{2}-[0-9]{2}$)")
          - set(cache["output_price"], ${file:/pricing/GPT56_TERRA_OUT}) where IsMatch(attributes["model"], "^gpt-5\\.6-terra($|-[0-9]{4}-[0-9]{2}-[0-9]{2}$)")
          - set(cache["input_price"], ${file:/pricing/GPT56_LUNA_IN}) where IsMatch(attributes["model"], "^gpt-5\\.6-luna($|-[0-9]{4}-[0-9]{2}-[0-9]{2}$)")
          - set(cache["cached_price"], ${file:/pricing/GPT56_LUNA_CACHED}) where IsMatch(attributes["model"], "^gpt-5\\.6-luna($|-[0-9]{4}-[0-9]{2}-[0-9]{2}$)")
          - set(cache["output_price"], ${file:/pricing/GPT56_LUNA_OUT}) where IsMatch(attributes["model"], "^gpt-5\\.6-luna($|-[0-9]{4}-[0-9]{2}-[0-9]{2}$)")
          - set(attributes["cache_write_token_count"], 0) where attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["cache_write_token_count"] == nil
          - set(cache["input_multiplier"], 1.0)
          - set(cache["output_multiplier"], 1.0)
          - set(cache["tier_multiplier"], 1.0)
          - set(cache["input_multiplier"], 2.0) where attributes["input_token_count"] != nil and Double(attributes["input_token_count"]) > 272000.0
          - set(cache["output_multiplier"], 1.5) where attributes["input_token_count"] != nil and Double(attributes["input_token_count"]) > 272000.0
          - set(cache["tier_multiplier"], 2.0) where attributes["service_tier"] == "priority" or attributes["service_tier"] == "fast"
          - set(cache["tier_multiplier"], 0.5) where attributes["service_tier"] == "flex"
          - set(attributes["cost_usd_estimated"], (((Double(attributes["input_token_count"]) - Double(attributes["cached_token_count"]) + Double(attributes["cache_write_token_count"]) * 0.25) * cache["input_price"] + Double(attributes["cached_token_count"]) * cache["cached_price"]) * cache["input_multiplier"] + Double(attributes["output_token_count"]) * cache["output_price"] * cache["output_multiplier"]) * cache["tier_multiplier"] / 1000000.0) where attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["cost_usd"] == nil and attributes["cost_usd_estimated"] == nil and cache["input_price"] != nil and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and Double(attributes["cached_token_count"]) >= 0.0 and Double(attributes["cache_write_token_count"]) >= 0.0 and Double(attributes["input_token_count"]) >= Double(attributes["cached_token_count"]) + Double(attributes["cache_write_token_count"]) and Double(attributes["output_token_count"]) >= 0.0 and (attributes["service_tier"] == nil or attributes["service_tier"] == "default" or attributes["service_tier"] == "auto" or attributes["service_tier"] == "standard" or attributes["service_tier"] == "priority" or attributes["service_tier"] == "fast" or attributes["service_tier"] == "flex")
          # Legacy GPT-5 mini and GPT-5.2/5.3 Codex.
          - set(attributes["cost_usd_estimated"], ((Double(attributes["input_token_count"]) - Double(attributes["cached_token_count"])) * ${file:/pricing/GPT5_MINI_IN} + Double(attributes["cached_token_count"]) * ${file:/pricing/GPT5_MINI_CACHED} + Double(attributes["output_token_count"]) * ${file:/pricing/GPT5_MINI_OUT}) / 1000000.0) where attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["cost_usd"] == nil and attributes["cost_usd_estimated"] == nil and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and IsMatch(attributes["model"], "^gpt-5( mini|-mini)($|-)")
          - set(attributes["cost_usd_estimated"], ((Double(attributes["input_token_count"]) - Double(attributes["cached_token_count"])) * ${file:/pricing/GPT53_CODEX_IN} + Double(attributes["cached_token_count"]) * ${file:/pricing/GPT53_CODEX_CACHED} + Double(attributes["output_token_count"]) * ${file:/pricing/GPT53_CODEX_OUT}) / 1000000.0) where attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["cost_usd"] == nil and attributes["cost_usd_estimated"] == nil and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and IsMatch(attributes["model"], "^gpt-5\\.[23]-codex($|-)")
          - set(attributes["effective_cost_usd"], attributes["cost_usd_estimated"]) where attributes["cost_usd_estimated"] != nil and attributes["cost_usd"] == nil
          - set(attributes["cost_source"], "estimated") where attributes["cost_usd_estimated"] != nil and attributes["cost_usd"] == nil
          - set(attributes["pricing_as_of"], "2026-09-08") where attributes["cost_usd_estimated"] != nil and attributes["cost_usd"] == nil
          - set(attributes["cost_source"], "unsupported") where attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["effective_cost_usd"] == nil
          - set(attributes["pricing_as_of"], "2026-09-08") where attributes["event.name"] == "codex.sse_event" and attributes["event.kind"] == "response.completed" and attributes["effective_cost_usd"] == nil
  transform/gemini_enrichment:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # ---- Specific models (most accurate, matched first) ----
          # Price files are generated by pricing-exporter from LiteLLM data.
          # Gemini 2.0 Flash
          - set(attributes["cost_usd_estimated"], ((Double(attributes["input_token_count"]) - Double(attributes["cached_content_token_count"])) * ${file:/pricing/GEMINI_20_FLASH_IN} + Double(attributes["cached_content_token_count"]) * ${file:/pricing/GEMINI_20_FLASH_CACHED} + Double(attributes["output_token_count"]) * ${file:/pricing/GEMINI_20_FLASH_OUT}) / 1000000.0) where attributes["event.name"] == "gemini_cli.api_response" and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and attributes["cached_content_token_count"] != nil and IsMatch(attributes["model"], "^gemini-2\\.0-flash")
          - set(attributes["cost_usd_estimated"], (Double(attributes["input_token_count"]) * ${file:/pricing/GEMINI_20_FLASH_IN} + Double(attributes["output_token_count"]) * ${file:/pricing/GEMINI_20_FLASH_OUT}) / 1000000.0) where attributes["event.name"] == "gemini_cli.api_response" and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and attributes["cached_content_token_count"] == nil and IsMatch(attributes["model"], "^gemini-2\\.0-flash")
          # Gemini 2.5 Flash-Lite
          - set(attributes["cost_usd_estimated"], ((Double(attributes["input_token_count"]) - Double(attributes["cached_content_token_count"])) * ${file:/pricing/GEMINI_25_FLASH_LITE_IN} + Double(attributes["cached_content_token_count"]) * ${file:/pricing/GEMINI_25_FLASH_LITE_CACHED} + Double(attributes["output_token_count"]) * ${file:/pricing/GEMINI_25_FLASH_LITE_OUT}) / 1000000.0) where attributes["event.name"] == "gemini_cli.api_response" and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and attributes["cached_content_token_count"] != nil and attributes["cost_usd_estimated"] == nil and IsMatch(attributes["model"], "^gemini-2\\.5-flash-lite")
          - set(attributes["cost_usd_estimated"], (Double(attributes["input_token_count"]) * ${file:/pricing/GEMINI_25_FLASH_LITE_IN} + Double(attributes["output_token_count"]) * ${file:/pricing/GEMINI_25_FLASH_LITE_OUT}) / 1000000.0) where attributes["event.name"] == "gemini_cli.api_response" and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and attributes["cached_content_token_count"] == nil and attributes["cost_usd_estimated"] == nil and IsMatch(attributes["model"], "^gemini-2\\.5-flash-lite")
          # Gemini 2.5 Flash
          - set(attributes["cost_usd_estimated"], ((Double(attributes["input_token_count"]) - Double(attributes["cached_content_token_count"])) * ${file:/pricing/GEMINI_25_FLASH_IN} + Double(attributes["cached_content_token_count"]) * ${file:/pricing/GEMINI_25_FLASH_CACHED} + Double(attributes["output_token_count"]) * ${file:/pricing/GEMINI_25_FLASH_OUT}) / 1000000.0) where attributes["event.name"] == "gemini_cli.api_response" and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and attributes["cached_content_token_count"] != nil and attributes["cost_usd_estimated"] == nil and IsMatch(attributes["model"], "^gemini-2\\.5-flash")
          - set(attributes["cost_usd_estimated"], (Double(attributes["input_token_count"]) * ${file:/pricing/GEMINI_25_FLASH_IN} + Double(attributes["output_token_count"]) * ${file:/pricing/GEMINI_25_FLASH_OUT}) / 1000000.0) where attributes["event.name"] == "gemini_cli.api_response" and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and attributes["cached_content_token_count"] == nil and attributes["cost_usd_estimated"] == nil and IsMatch(attributes["model"], "^gemini-2\\.5-flash")
          # Gemini 2.5 Pro
          - set(attributes["cost_usd_estimated"], ((Double(attributes["input_token_count"]) - Double(attributes["cached_content_token_count"])) * ${file:/pricing/GEMINI_25_PRO_IN} + Double(attributes["cached_content_token_count"]) * ${file:/pricing/GEMINI_25_PRO_CACHED} + Double(attributes["output_token_count"]) * ${file:/pricing/GEMINI_25_PRO_OUT}) / 1000000.0) where attributes["event.name"] == "gemini_cli.api_response" and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and attributes["cached_content_token_count"] != nil and attributes["cost_usd_estimated"] == nil and IsMatch(attributes["model"], "^gemini-2\\.5-pro")
          - set(attributes["cost_usd_estimated"], (Double(attributes["input_token_count"]) * ${file:/pricing/GEMINI_25_PRO_IN} + Double(attributes["output_token_count"]) * ${file:/pricing/GEMINI_25_PRO_OUT}) / 1000000.0) where attributes["event.name"] == "gemini_cli.api_response" and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and attributes["cached_content_token_count"] == nil and attributes["cost_usd_estimated"] == nil and IsMatch(attributes["model"], "^gemini-2\\.5-pro")
          # Gemini 3.x Flash-Lite
          - set(attributes["cost_usd_estimated"], ((Double(attributes["input_token_count"]) - Double(attributes["cached_content_token_count"])) * ${file:/pricing/GEMINI_3X_FLASH_LITE_IN} + Double(attributes["cached_content_token_count"]) * ${file:/pricing/GEMINI_3X_FLASH_LITE_CACHED} + Double(attributes["output_token_count"]) * ${file:/pricing/GEMINI_3X_FLASH_LITE_OUT}) / 1000000.0) where attributes["event.name"] == "gemini_cli.api_response" and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and attributes["cached_content_token_count"] != nil and attributes["cost_usd_estimated"] == nil and IsMatch(attributes["model"], "gemini-3.*flash-lite")
          - set(attributes["cost_usd_estimated"], (Double(attributes["input_token_count"]) * ${file:/pricing/GEMINI_3X_FLASH_LITE_IN} + Double(attributes["output_token_count"]) * ${file:/pricing/GEMINI_3X_FLASH_LITE_OUT}) / 1000000.0) where attributes["event.name"] == "gemini_cli.api_response" and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and attributes["cached_content_token_count"] == nil and attributes["cost_usd_estimated"] == nil and IsMatch(attributes["model"], "gemini-3.*flash-lite")
          # ---- Family fallbacks (future-proof, guard ensures specifics always win) ----
          # Any Gemini Pro (3-pro, 3.1-pro, 4-pro, ...)
          - set(attributes["cost_usd_estimated"], ((Double(attributes["input_token_count"]) - Double(attributes["cached_content_token_count"])) * ${file:/pricing/GEMINI_PRO_IN} + Double(attributes["cached_content_token_count"]) * ${file:/pricing/GEMINI_PRO_CACHED} + Double(attributes["output_token_count"]) * ${file:/pricing/GEMINI_PRO_OUT}) / 1000000.0) where attributes["event.name"] == "gemini_cli.api_response" and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and attributes["cached_content_token_count"] != nil and attributes["cost_usd_estimated"] == nil and IsMatch(attributes["model"], "gemini-.*pro")
          - set(attributes["cost_usd_estimated"], (Double(attributes["input_token_count"]) * ${file:/pricing/GEMINI_PRO_IN} + Double(attributes["output_token_count"]) * ${file:/pricing/GEMINI_PRO_OUT}) / 1000000.0) where attributes["event.name"] == "gemini_cli.api_response" and attributes["input_token_count"] != nil and attributes["output_token_count"] != nil and attributes["cached_content_token_count"] == nil and attributes["cost_usd_estimated"] == nil and IsMatch(attributes["model"], "gemini-.*pro")
