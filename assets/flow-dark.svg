<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Flow: Codex, Claude Code and Gemini CLI send OTLP over HTTP with a bearer token to the OpenTelemetry Collector, which writes logs to VictoriaLogs, traces to VictoriaTraces and metrics to VictoriaMetrics. Grafana reads all three. The pricing exporter feeds price files to the collector and the EUR rate to VictoriaMetrics.">
