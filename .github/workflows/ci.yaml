name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OTEL_AUTH_TOKEN: ci-config-only
      GRAFANA_ADMIN_PASSWORD: ci-config-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: pricing-exporter/uv.lock
      - name: Public-data guards and file checks
        run: |
          uvx --from pre-commit==4.3.0 pre-commit run --all-files
          # The normal Gitleaks hook scans staged changes; CI needs committed history.
          uvx --from pre-commit==4.3.0 pre-commit run gitleaks-ci --hook-stage manual --all-files
      - name: Shared version, JSON and Compose configuration
        run: |
          python3 scripts/release.py
          jq empty grafana/dashboards/*.json extras/credit-resets/*.json
          docker compose config -q
          PRICING_IMAGE=ghcr.io/example/pricing-exporter:v0.1.0 docker compose -f compose.yaml -f compose.release.yaml config --format json > /tmp/release-compose.json
          python3 - <<'PY'
          import json
          with open('/tmp/release-compose.json') as file:
              services = json.load(file)['services']
          assert services['pricing-init']['image'] == services['pricing-exporter']['image']
          assert services['pricing-exporter']['image'] == 'ghcr.io/example/pricing-exporter:v0.1.0'
          assert all('build' not in services[name] for name in ('pricing-init', 'pricing-exporter'))
          PY
      - name: Unit tests
        run: |
          python3 -m unittest discover -s scripts/tests
          python3 -m unittest discover -s git-ai-exporter/tests
          uv --directory pricing-exporter sync --frozen --python 3.13
          uv --directory pricing-exporter run --frozen python -m unittest discover -s tests

  smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: ai-cli-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create disposable test credentials
        run: |
          echo "OTEL_AUTH_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Build and start the test stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: OTLP, Grafana and pricing smoke test
        run: python3 scripts/smoke.py
      - name: Diagnose failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop the test stack
        if: always()
        run: docker compose down
