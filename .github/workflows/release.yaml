name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, notes and release ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py --tag "$GITHUB_REF_NAME"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          git merge-base --is-ancestor HEAD origin/main
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-tags"; then
            echo 'This release already exists; do not republish its image.' >&2
            exit 1
          fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  publish:
    needs: [version, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recheck release before registry access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A publish-only rerun skips the version job.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-tags"; then
            echo 'This release already exists; do not republish its image.' >&2
            exit 1
          fi
      - name: Image coordinates
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-pricing-exporter" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the versioned pricing image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./pricing-exporter
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Bundle matching sources, digest and release notes
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          VERSION=$(python3 scripts/release.py --tag "$GITHUB_REF_NAME")
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          DIST="$RUNNER_TEMP/release"
          mkdir -p "$DIST"
          BUNDLE="ai-cli-observability-$GITHUB_REF_NAME.tar.gz"
          REVISION=$(git rev-parse HEAD)
          git archive --format=tar.gz --prefix="ai-cli-observability-$GITHUB_REF_NAME/" --output="$DIST/$BUNDLE" HEAD
          git ls-files -z | xargs -0 sha256sum > "$DIST/release-files.sha256"
          jq -n --arg version "$VERSION" --arg tag "$GITHUB_REF_NAME" --arg revision "$REVISION" --arg image "$IMAGE:$GITHUB_REF_NAME@$DIGEST" --arg bundle "$BUNDLE" \
            '{version: $version, tag: $tag, source_revision: $revision, pricing_image: $image, platforms: ["linux/amd64", "linux/arm64"], source_bundle: $bundle}' > "$DIST/release-manifest.json"
          (cd "$DIST" && sha256sum "$BUNDLE" release-manifest.json release-files.sha256 > SHA256SUMS)
          python3 scripts/release.py --notes > "$DIST/release-notes.md"
          cat >> "$DIST/release-notes.md" <<EOF

          ### Deployment references

          - Source commit: \`$REVISION\`
          - Pricing image (Linux amd64 and arm64): \`$IMAGE:$GITHUB_REF_NAME@$DIGEST\`
          - Download \`$BUNDLE\` for matching collector, pricing, dashboards and client examples.
          - Verify \`SHA256SUMS\` and then \`release-files.sha256\` in the extracted bundle.
          - Follow \`RELEASING.md\` in the bundle for upgrade and rollback steps. Keep your existing secrets and volumes.
          EOF
      - name: Publish GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIST="$RUNNER_TEMP/release"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$DIST/release-notes.md" --generate-notes \
            "$DIST/ai-cli-observability-$GITHUB_REF_NAME.tar.gz" \
            "$DIST/release-manifest.json" "$DIST/release-files.sha256" "$DIST/SHA256SUMS"
